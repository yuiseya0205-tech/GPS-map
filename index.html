<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>GPS_MAP_SYSTEM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif}
#map{position:absolute;inset:0;width:100%;height:100%}
#viewBox,#followBox,#twoPointBox,#spawnBtn,#qrBtn,#walkBox,#speedNow,#dir,#eta,#statusBox,#shopBtn{
position:absolute;background:#fff;z-index:9999;border:1px solid #000;box-sizing:border-box
}
#viewBox{top:10px;left:10px;padding:5px}
#followBox{top:10px;left:180px;padding:10px;font-size:18px}
#twoPointBox{top:10px;left:280px;padding:10px;font-size:18px}
#spawnBtn{top:10px;left:430px;padding:10px;font-size:18px;cursor:pointer}
#qrBtn{top:10px;left:650px;padding:10px;font-size:18px;cursor:pointer}
#walkBox{top:10px;right:10px;padding:10px;font-size:18px}
#shopBtn{top:58px;right:10px;padding:10px 18px;font-size:20px;cursor:pointer}
#statusBox{top:110px;right:10px;padding:10px;font-size:18px}
#speedNow{bottom:60px;left:0;padding:10px;font-size:18px}
#dir{bottom:0;left:50%;transform:translateX(-50%);padding:10px;font-size:20px;min-width:180px;text-align:center}
#eta{bottom:0;left:0;padding:10px;font-size:18px}
#spawnBox,#qrBox,#shopBox{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:#fff;padding:20px;z-index:99999;display:none;text-align:center;
border:2px solid #000;box-sizing:border-box
}
#shopBox{width:350px}
#shopTitle{font-size:28px;font-weight:bold;margin-bottom:15px}
.shopStat{font-size:20px;margin:8px}
.shopButton{display:block;width:90%;margin:12px auto!important}
#qrImg{width:250px;height:250px}
#spawnBox button,#qrBox button,#shopBox button{
font-size:18px;margin:5px;padding:10px 18px
}
.monsterIcon{font-size:30px}
</style>
</head>
<body>

<div id="map"></div>

<div id="viewBox">
<select id="viewSelect" onchange="changeView()">
<option value="osm">OpenStreetMap</option>
<option value="gsi_light">地理院地図 淡色</option>
<option value="gsi_ortho">地理院地図 オルソ</option>
</select>
</div>

<div id="followBox">
<label><input type="checkbox" id="followMode">追従</label>
</div>

<div id="twoPointBox">
<label><input type="checkbox" id="twoPointMode">2点ルート</label>
</div>

<div id="spawnBtn" onclick="openSpawnBox()">🔴 スポーン地点</div>
<div id="qrBtn" onclick="openQR()">QRコード</div>

<div id="walkBox">
🚶 今日 <span id="walkKm">0.00</span> km
</div>

<div id="shopBtn" onclick="openShop()">🛒 ショップ</div>

<div id="statusBox">
⭐ Lv.<span id="levelText">1</span><br>
💰 <span id="coinText">0</span><br>
⚔️ <span id="attackText">10</span><br>
❤️ <span id="hpText">100</span>/<span id="maxHpText">100</span>
</div>

<div id="speedNow">時速 0.0 km/h</div>
<div id="dir">スポーン地点を設定してください</div>
<div id="eta"></div>

<div id="spawnBox">
<div id="spawnStatus">スポーン地点を設定</div>
<button onclick="setSpawnHere()">現在地をスポーン地点にする</button>
<button onclick="clearSpawn()">スポーン地点削除</button>
<button onclick="closeSpawnBox()">閉じる</button>
</div>

<div id="qrBox">
<img id="qrImg">
<br>
<button onclick="closeQR()">閉じる</button>
</div>

<div id="shopBox">
<div id="shopTitle">🛒 ショップ</div>
<div class="shopStat">⭐ レベル: <span id="shopLevel">1</span></div>
<div class="shopStat">💰 コイン: <span id="shopCoins">0</span></div>
<div class="shopStat">⚔️ 攻撃力: <span id="shopAttack">10</span></div>
<div class="shopStat">❤️ HP: <span id="shopHp">100</span>/<span id="shopMaxHp">100</span></div>
<div class="shopStat">💵 次の強化に <span id="shopCost">10</span>コイン必要</div>
<button class="shopButton" onclick="buyAttack()">⚔️ 攻撃力 +5</button>
<button class="shopButton" onclick="buyHp()">❤️ 最大HP +20</button>
<button class="shopButton" onclick="closeShop()">閉じる</button>
</div>

<script>
const JSONBIN_URL="https://api.jsonbin.io/v3/b/6a829d2cf5f4af5e291f1a4e";
const JSONBIN_KEY="$2a$10$DKqFC6yTYkzmTbKXVnnDhuV/nvXdKOTSi8rMMHNmicw8l/DohMcE2";

function getQueryId(){
return new URLSearchParams(location.search).get("id");
}

function genId(){
return"ID_"+Math.random().toString(36).slice(2)+Date.now().toString(36);
}

const queryId=getQueryId();
const targetId=localStorage.getItem("targetId")||queryId||genId();
localStorage.setItem("targetId",targetId);

const map=L.map("map",{
zoomControl:true,
scrollWheelZoom:true,
doubleClickZoom:true,
touchZoom:true,
dragging:true
}).setView([35,135],5);

const layers={
osm:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}),
gsi_light:L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{maxZoom:18}),
gsi_ortho:L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg",{maxZoom:18})
};

layers.osm.addTo(map);

function changeView(){
Object.values(layers).forEach(l=>map.removeLayer(l));
layers[document.getElementById("viewSelect").value].addTo(map);
}

let marker=null;
let currentPos=null;
let routeLine=null;
let spawnRoute=null;
let spawnMarker=null;
let steps=[];
let targetSpeed=0;
let smoothSpeed=0;
let lastSpeedPos=null;
let lastSpeedTime=null;
let twoPointMode=false;
let startPoint=null;
let endPoint=null;
let twoPointMarkers=[];
let spawnPoint=null;
let monsters=[];

let player={
level:Number(localStorage.getItem("playerLevel")||1),
attack:Number(localStorage.getItem("playerAttack")||10),
hp:Number(localStorage.getItem("playerHp")||100),
maxHp:Number(localStorage.getItem("playerMaxHp")||100),
coins:Number(localStorage.getItem("playerCoins")||0)
};

function getUpgradeCost(){
return 10+(player.level-1)*20;
}

function savePlayer(){
localStorage.setItem("playerLevel",player.level);
localStorage.setItem("playerAttack",player.attack);
localStorage.setItem("playerHp",player.hp);
localStorage.setItem("playerMaxHp",player.maxHp);
localStorage.setItem("playerCoins",player.coins);
updatePlayerUI();
}

function updatePlayerUI(){
document.getElementById("levelText").innerText=player.level;
document.getElementById("coinText").innerText=player.coins;
document.getElementById("attackText").innerText=player.attack;
document.getElementById("hpText").innerText=player.hp;
document.getElementById("maxHpText").innerText=player.maxHp;
}

function openShop(){
const cost=getUpgradeCost();
document.getElementById("shopLevel").innerText=player.level;
document.getElementById("shopCoins").innerText=player.coins;
document.getElementById("shopAttack").innerText=player.attack;
document.getElementById("shopHp").innerText=player.hp;
document.getElementById("shopMaxHp").innerText=player.maxHp;
document.getElementById("shopCost").innerText=cost;
document.getElementById("shopBox").style.display="block";
}

function closeShop(){
document.getElementById("shopBox").style.display="none";
}

function buyAttack(){
const cost=getUpgradeCost();

if(player.coins<cost){
alert("コインが足りません。"+cost+"コイン必要です。");
return;
}

player.coins-=cost;
player.attack+=5;
player.level++;

savePlayer();
openShop();
}

function buyHp(){
const cost=getUpgradeCost();

if(player.coins<cost){
alert("コインが足りません。"+cost+"コイン必要です。");
return;
}

player.coins-=cost;
player.maxHp+=20;
player.hp=player.maxHp;
player.level++;

savePlayer();
openShop();
}

function smoothLoop(){
smoothSpeed+=(targetSpeed-smoothSpeed)*.15;
document.getElementById("speedNow").innerText="時速 "+smoothSpeed.toFixed(1)+" km/h";
requestAnimationFrame(smoothLoop);
}

smoothLoop();

function haversine(a,b){
const R=6371000;
const lat1=a[0]*Math.PI/180;
const lat2=b[0]*Math.PI/180;
const dLat=(b[0]-a[0])*Math.PI/180;
const dLon=(b[1]-a[1])*Math.PI/180;

const h=Math.sin(dLat/2)**2+
Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

function calcTime(distance){
const sp=Math.max(targetSpeed,5);
const minutes=distance/(sp*1000)*60;
const h=Math.floor(minutes/60);
const m=Math.round(minutes%60);
return(h>0?h+"時間":"")+m+"分";
}

async function getRoute(from,to){
const url=
"https://router.project-osrm.org/route/v1/driving/"+
from[1]+","+from[0]+";"+
to[1]+","+to[0]+
"?overview=full&geometries=geojson&steps=true";

try{
const r=await fetch(url);
const d=await r.json();

if(!d.routes||!d.routes.length)return null;

return d.routes[0];
}catch(e){
return null;
}
}

async function routeToSpawn(){
if(!currentPos||!spawnPoint)return;

const route=await getRoute(currentPos,spawnPoint);

if(!route)return;

const coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);

if(spawnRoute)map.removeLayer(spawnRoute);

spawnRoute=L.polyline(coords,{
color:"red",
weight:6
}).addTo(map);

steps=route.legs[0].steps||[];

document.getElementById("eta").innerText=
"スポーンまで "+
(route.distance/1000).toFixed(2)+" km "+
calcTime(route.distance);
}

async function routeTwoPoints(){
if(!startPoint||!endPoint)return;

const route=await getRoute(startPoint,endPoint);

if(!route)return;

const coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);

if(routeLine)map.removeLayer(routeLine);

routeLine=L.polyline(coords,{
color:"red",
weight:6
}).addTo(map);

steps=route.legs[0].steps||[];

document.getElementById("eta").innerText=
"距離 "+(route.distance/1000).toFixed(2)+" km "+
calcTime(route.distance);

map.fitBounds(routeLine.getBounds(),{padding:[50,50]});
}

function spawnIcon(){
return L.divIcon({
html:"🔴",
className:"",
iconSize:[32,32],
iconAnchor:[16,16]
});
}

function monsterIcon(){
return L.divIcon({
html:"👹",
className:"monsterIcon",
iconSize:[40,40],
iconAnchor:[20,20]
});
}

function createMonsterPosition(center){
const angle=Math.random()*Math.PI*2;
const distance=100+Math.random()*900;

return[
center[0]+Math.cos(angle)*distance/111000,
center[1]+Math.sin(angle)*distance/(111000*Math.cos(center[0]*Math.PI/180))
];
}

function generateMonsters(){
monsters.forEach(m=>{
if(m.marker)map.removeLayer(m.marker);
});

monsters=[];

if(!spawnPoint)return;

const count=5+Math.floor(Math.random()*16);

for(let i=0;i<count;i++){

const pos=createMonsterPosition(spawnPoint);

const monster={
hp:30+Math.floor(Math.random()*71),
attack:5+Math.floor(Math.random()*16),
marker:null
};

monster.maxHp=monster.hp;

monster.marker=L.marker(pos,{
icon:monsterIcon()
}).addTo(map);

monster.marker.bindTooltip(
"👹 HP "+monster.hp+"/"+monster.maxHp,
{direction:"top"}
);

monster.marker.on("click",()=>{
alert(
"モンスター\n"+
"HP: "+monster.hp+"\n"+
"攻撃力: "+monster.attack
);
});

monsters.push(monster);
}
}

function showSpawn(){
if(!spawnPoint)return;

if(spawnMarker)map.removeLayer(spawnMarker);

spawnMarker=L.marker(spawnPoint,{
icon:spawnIcon()
}).addTo(map);

spawnMarker.bindPopup("スポーン地点");

generateMonsters();

if(currentPos)routeToSpawn();
}

function openSpawnBox(){
document.getElementById("spawnBox").style.display="block";

document.getElementById("spawnStatus").innerText=
spawnPoint?
"スポーン地点: "+
spawnPoint[0].toFixed(6)+", "+
spawnPoint[1].toFixed(6):
"スポーン地点を設定";
}

function closeSpawnBox(){
document.getElementById("spawnBox").style.display="none";
}

function setSpawnHere(){
if(!currentPos)return;

spawnPoint=[currentPos[0],currentPos[1]];

localStorage.setItem(
"spawnPoint",
JSON.stringify(spawnPoint)
);

showSpawn();
saveBin();
closeSpawnBox();
}

function clearSpawn(){
spawnPoint=null;
localStorage.removeItem("spawnPoint");

if(spawnMarker){
map.removeLayer(spawnMarker);
spawnMarker=null;
}

if(spawnRoute){
map.removeLayer(spawnRoute);
spawnRoute=null;
}

monsters.forEach(m=>{
if(m.marker)map.removeLayer(m.marker);
});

monsters=[];

document.getElementById("eta").innerText="";
document.getElementById("dir").innerText="スポーン地点を設定してください";

saveBin();
closeSpawnBox();
}

document.getElementById("twoPointMode").addEventListener("change",function(){

twoPointMode=this.checked;

startPoint=null;
endPoint=null;

twoPointMarkers.forEach(m=>map.removeLayer(m));

twoPointMarkers=[];

if(routeLine){
map.removeLayer(routeLine);
routeLine=null;
}

if(twoPointMode){
document.getElementById("dir").innerText="1点目をタップしてください";
}else{
document.getElementById("dir").innerText=
spawnPoint?
"スポーン地点へ移動します":
"スポーン地点を設定してください";
}
});

map.on("click",function(e){

const p=[e.latlng.lat,e.latlng.lng];

if(twoPointMode){

if(!startPoint){
startPoint=p;
twoPointMarkers.push(L.marker(p).addTo(map));
document.getElementById("dir").innerText="2点目をタップしてください";
return;
}

if(!endPoint){
endPoint=p;
twoPointMarkers.push(L.marker(p).addTo(map));
routeTwoPoints();
return;
}

startPoint=p;
endPoint=null;

twoPointMarkers.forEach(m=>map.removeLayer(m));

twoPointMarkers=[];

if(routeLine){
map.removeLayer(routeLine);
routeLine=null;
}

twoPointMarkers.push(L.marker(p).addTo(map));

document.getElementById("dir").innerText="2点目をタップしてください";

return;
}

spawnPoint=p;

localStorage.setItem(
"spawnPoint",
JSON.stringify(spawnPoint)
);

showSpawn();
saveBin();
});

const todayKey="walk_"+new Date().toISOString().slice(0,10);

let totalMeter=Number(
localStorage.getItem(todayKey)||0
);

document.getElementById("walkKm").innerText=
(totalMeter/1000).toFixed(2);

let lastWalkPos=null;

navigator.geolocation.watchPosition(function(p){

const now=[
p.coords.latitude,
p.coords.longitude
];

const nowTime=Date.now();

if(lastSpeedPos){

const dist=haversine(
lastSpeedPos,
now
);

const dt=(nowTime-lastSpeedTime)/1000;

if(dt>0){

const speed=dist/dt*3.6;

if(speed<250){
targetSpeed=speed;
}
}
}

lastSpeedPos=now;
lastSpeedTime=now;
currentPos=now;

if(!marker){
marker=L.marker(now).addTo(map);
}else{
marker.setLatLng(now);
}

if(document.getElementById("followMode").checked){
map.setView(now,17);
}

if(lastWalkPos){

const d=haversine(
lastWalkPos,
now
);

if(d<50){

totalMeter+=d;

localStorage.setItem(
todayKey,
totalMeter
);

document.getElementById("walkKm").innerText=
(totalMeter/1000).toFixed(2);
}
}

lastWalkPos=now;

if(spawnPoint&&!twoPointMode){
routeToSpawn();
}

if(queryId){
sendMyPositionToBin();
}

},{
enableHighAccuracy:true,
maximumAge:1000,
timeout:10000
});

function openQR(){

const url=
location.origin+
location.pathname+
"?id="+
encodeURIComponent(targetId);

const qr=
"https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+
encodeURIComponent(url);

document.getElementById("qrImg").src=qr;

document.getElementById("qrBox").style.display="block";
}

function closeQR(){
document.getElementById("qrBox").style.display="none";
}

async function getRecord(){

const r=await fetch(
JSONBIN_URL,
{
headers:{
"X-Master-Key":JSONBIN_KEY
}
}
);

const d=await r.json();

return d.record||{};
}

async function saveBin(){

try{

const record=await getRecord();

record.targetId=record.targetId||targetId;
record.points=record.points||[];
record.targets=record.targets||[];
record.spawns=record.spawns||[];

record.spawns=record.spawns.filter(
x=>x.id!==targetId
);

if(spawnPoint){

record.spawns.push({
id:targetId,
lat:spawnPoint[0],
lon:spawnPoint[1]
});

}

await fetch(
JSONBIN_URL,
{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Master-Key":JSONBIN_KEY
},
body:JSON.stringify(record)
}
);

}catch(e){}
}

async function loadBin(){

try{

const record=await getRecord();

if(record.spawns&&!spawnPoint){

const remote=record.spawns.find(
x=>x.id===targetId
);

if(remote){

spawnPoint=[
remote.lat,
remote.lon
];

localStorage.setItem(
"spawnPoint",
JSON.stringify(spawnPoint)
);

showSpawn();

}
}

}catch(e){}
}

async function sendMyPositionToBin(){

if(!currentPos)return;

try{

const record=await getRecord();

record.targetId=record.targetId||targetId;
record.points=record.points||[];
record.targets=record.targets||[];
record.spawns=record.spawns||[];

record.targets=record.targets.filter(
t=>t.id!==targetId
);

record.targets.push({
id:targetId,
lat:currentPos[0],
lon:currentPos[1]
});

await fetch(
JSONBIN_URL,
{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Master-Key":JSONBIN_KEY
},
body:JSON.stringify(record)
}
);

}catch(e){}
}

const savedSpawn=localStorage.getItem("spawnPoint");

if(savedSpawn){

try{

spawnPoint=JSON.parse(savedSpawn);

showSpawn();

}catch(e){

localStorage.removeItem("spawnPoint");

}
}

updatePlayerUI();
loadBin();
setInterval(loadBin,5000);
</script>

</body>
</html>
