<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS_SHARE_PHOTO_LOCATION</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body{margin:0;overflow:hidden;}
#map{position:absolute;left:0;top:0;width:100%;height:100vh;}
#qrBtn{position:absolute;top:10px;left:10px;background:white;padding:10px;font-size:20px;z-index:9999;}
#qrBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;z-index:99999;display:none;text-align:center;}
#qrImg{width:250px;height:250px;}
#qrClose{font-size:20px;margin-top:10px;}
#cameraBtn{position:absolute;top:10px;left:120px;background:white;padding:10px;font-size:20px;z-index:9999;}
#cameraBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;z-index:99999;display:none;text-align:center;}
#cameraVideo{width:300px;height:auto;}
#cameraShoot{font-size:20px;margin-top:10px;}
#cameraClose{font-size:20px;margin-top:10px;}
#cameraSwitch{font-size:20px;margin-top:10px;}
#titleInputBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;z-index:99999;display:none;}
#titleInput{font-size:20px;width:300px;}
#titleSaveBtn{font-size:20px;margin-top:10px;}
#photoView{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99999;background:white;padding:10px;display:none;text-align:center;}
#photoTitle{font-size:24px;margin-bottom:10px;}
#photoView img{max-width:90vw;max-height:80vh;width:auto;height:auto;}
#closePhoto{font-size:20px;margin-top:10px;}
.photo-marker{cursor:pointer;pointer-events:auto;}
</style>
</head>
<body>

<div id="map"></div>
<div id="qrBtn" onclick="openQR()">QR</div>
<div id="cameraBtn" onclick="openCamera()">📷</div>

<div id="qrBox">
<img id="qrImg">
<button id="qrClose" onclick="closeQR()">閉じる</button>
</div>

<div id="cameraBox">
<video id="cameraVideo" autoplay></video>
<button id="cameraShoot" onclick="shootPhoto()">撮影</button>
<button id="cameraSwitch" onclick="switchCamera()">切替</button>
<button id="cameraClose" onclick="closeCamera()">閉じる</button>
</div>

<div id="titleInputBox">
<input id="titleInput">
<button id="titleSaveBtn" onclick="saveTitle()">保存</button>
</div>

<div id="photoView">
<div id="photoTitle"></div>
<img id="photoImg">
<div id="closePhoto" onclick="closePhoto()">閉じる</div>
</div>

<script>
const BIN="https://api.jsonbin.io/v3/b/6a829d2cf5f4af5e291f1a4e";
const KEY="$2a$10$DKqFC6yTYkzmTbKXVnnDhuV/nvXdKOTSi8rMMHNmicw8l/DohMcE2";

function genId(){return crypto.randomUUID();}
function getQueryId(){var s=location.search;if(!s)return null;var p=new URLSearchParams(s);return p.get("id");}

var storedId=localStorage.getItem("shareId");
var queryId=getQueryId();
var shareId=storedId||queryId||genId();
localStorage.setItem("shareId",shareId);

var map=L.map('map').setView([35,135],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

var myMarker=null;
var targetMarker=null;
var currentPos=null;
var tempPhoto=null;

navigator.geolocation.watchPosition(function(p){
currentPos=[p.coords.latitude,p.coords.longitude];
if(!myMarker)myMarker=L.marker(currentPos).addTo(map);
else myMarker.setLatLng(currentPos);
sendMyPos();
});

function sendMyPos(){
if(!currentPos)return;
fetch(BIN,{headers:{"X-Master-Key":KEY}})
.then(r=>r.json())
.then(data=>{
var rec=data.record||{};
rec.targets=rec.targets||[];
var i=rec.targets.findIndex(t=>t.id===shareId);
var o={id:shareId,lat:currentPos[0],lon:currentPos[1]};
if(i>=0)rec.targets[i]=o;else rec.targets.push(o);
fetch(BIN,{
method:"PUT",
headers:{"Content-Type":"application/json","X-Master-Key":KEY},
body:JSON.stringify(rec)
});
});
}

function loadTargets(){
fetch(BIN,{headers:{"X-Master-Key":KEY}})
.then(r=>r.json())
.then(data=>{
var rec=data.record||{};
if(!rec.targets)return;
var me=rec.targets.find(t=>t.id===shareId);
if(!me)return;
if(!targetMarker){
targetMarker=L.marker([me.lat,me.lon],{icon:L.divIcon({html:"●",className:"",iconSize:[20,20]})}).addTo(map);
}else{
targetMarker.setLatLng([me.lat,me.lon]);
}
});
}

setInterval(loadTargets,2000);

async function openCamera(){
cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraMode}});
document.getElementById("cameraVideo").srcObject=cameraStream;
document.getElementById("cameraBox").style.display="block";
}

var cameraStream=null;
var cameraMode="environment";

function switchCamera(){
cameraMode=cameraMode==="environment"?"user":"environment";
closeCamera();
openCamera();
}

function closeCamera(){
if(cameraStream){
cameraStream.getTracks().forEach(t=>t.stop());
}
document.getElementById("cameraBox").style.display="none";
}

function shootPhoto(){
var v=document.getElementById("cameraVideo");
var c=document.createElement("canvas");
c.width=v.videoWidth;
c.height=v.videoHeight;
c.getContext("2d").drawImage(v,0,0);
var img=c.toDataURL("image/png");
tempPhoto={id:shareId,lat:currentPos[0],lon:currentPos[1],img:img};
closeCamera();
document.getElementById("titleInputBox").style.display="block";
}

function saveTitle(){
var t=document.getElementById("titleInput").value;
document.getElementById("titleInput").value="";
document.getElementById("titleInputBox").style.display="none";
tempPhoto.title=t;
savePhoto(tempPhoto);
tempPhoto=null;
}

function savePhoto(p){
fetch(BIN,{headers:{"X-Master-Key":KEY}})
.then(r=>r.json())
.then(data=>{
var rec=data.record||{};
rec.photos=rec.photos||[];
rec.photos.push(p);
fetch(BIN,{
method:"PUT",
headers:{"Content-Type":"application/json","X-Master-Key":KEY},
body:JSON.stringify(rec)
});
});
}

function loadPhotos(){
fetch(BIN,{headers:{"X-Master-Key":KEY}})
.then(r=>r.json())
.then(data=>{
var rec=data.record||{};
if(!rec.photos)return;
rec.photos.filter(x=>x.id===shareId).forEach(function(p){
addPhotoMarker(p);
});
});
}

function addPhotoMarker(p){
var m=L.marker([p.lat,p.lon],{
icon:L.divIcon({html:"🖼",className:"photo-marker",iconSize:[20,20]})
}).addTo(map);
m.on("click",function(){
document.getElementById("photoTitle").innerText=p.title;
document.getElementById("photoImg").src=p.img;
document.getElementById("photoView").style.display="block";
});
m.on("contextmenu",function(){
deletePhoto(p);
map.removeLayer(m);
});
}

function deletePhoto(p){
fetch(BIN,{headers:{"X-Master-Key":KEY}})
.then(r=>r.json())
.then(data=>{
var rec=data.record||{};
rec.photos=rec.photos||[];
rec.photos=rec.photos.filter(x=>!(x.id===p.id&&x.lat===p.lat&&x.lon===p.lon&&x.title===p.title));
fetch(BIN,{
method:"PUT",
headers:{"Content-Type":"application/json","X-Master-Key":KEY},
body:JSON.stringify(rec)
});
});
}

function closePhoto(){
document.getElementById("photoView").style.display="none";
}

function openQR(){
var u=location.origin+location.pathname+"?id="+encodeURIComponent(shareId);
var q="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+encodeURIComponent(u);
document.getElementById("qrImg").src=q;
document.getElementById("qrBox").style.display="block";
}

function closeQR(){
document.getElementById("qrBox").style.display="none";
}

loadPhotos();
</script>
</body>
</html>
