<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS_System</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
#map{height:100vh;}
#dir{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:white;padding:10px;font-size:20px;z-index:9999;}
#eta{position:absolute;bottom:0;left:0;background:white;padding:10px;font-size:20px;z-index:9999;}
#arrow{width:30px;height:30px;font-size:30px;position:absolute;top:10px;right:10px;z-index:9999;}
#searchBox{position:absolute;top:10px;left:80px;z-index:9999;background:white;padding:5px;}
#results{position:absolute;top:50px;left:80px;z-index:9999;background:white;width:250px;max-height:250px;overflow:auto;display:none;}
.resultItem{padding:8px;border-bottom:1px solid #ccc;cursor:pointer;}
#viewBox{position:absolute;top:10px;right:10px;z-index:9999;background:white;padding:5px;}
.btn{padding:5px 10px;border:1px solid #000;cursor:pointer;margin:0 5px;display:inline-block;}
#twoPointBox{position:absolute;top:10px;left:300px;z-index:9999;background:white;padding:5px;}
</style>
</head>
<body>
<div id="map"></div>
<div id="dir"></div>
<div id="eta"></div>
<div id="arrow">▽</div>

<div id="searchBox">
<input id="word" placeholder="店を検索" style="width:200px;">
<button onclick="searchStore()">検索</button>
</div>

<div id="twoPointBox">
<label><input type="checkbox" id="twoPointMode"> 2点ルート</label>
</div>

<div id="viewBox">
<select id="viewSelect" onchange="changeView()">
<option value="osm">OpenStreetMap</option>
<option value="gsi_light">地理院地図 淡色</option>
<option value="gsi_ortho">地理院地図 オルソ</option>
</select>
</div>

<div id="results"></div>

<script>
var map=L.map('map').setView([35,135],5);

var layers={
osm:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}),
gsi_light:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18}),
gsi_ortho:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg',{maxZoom:18})
};

layers.osm.addTo(map);

function changeView(){
var v=document.getElementById("viewSelect").value;
Object.values(layers).forEach(l=>map.removeLayer(l));
layers[v].addTo(map);
}

var marker=null;
var routeLine=null;
var currentPos=null;
var steps=[];
var storeMarkers=[];
var lastTapPos=null;

navigator.geolocation.watchPosition(function(p){
currentPos=[p.coords.latitude,p.coords.longitude];
if(!marker){marker=L.marker(currentPos).addTo(map);}else{marker.setLatLng(currentPos);}
map.setView(currentPos,17);

if(steps.length>0){
var next=null;
var dist=999999;
steps.forEach(function(s){
var d=Math.hypot(currentPos[0]-s.maneuver.location[1],currentPos[1]-s.maneuver.location[0]);
if(d<dist){dist=d;next=s;}
});
if(next){
var m=next.maneuver;
var t="";
if(m.modifier==="right")t="右折";
if(m.modifier==="left")t="左折";
if(m.type==="straight")t="直進";
document.getElementById("dir").innerHTML=t;
}
}
},function(){
document.getElementById("dir").innerHTML=
"位置情報をオンにしますか？<div><span class='btn' onclick='gpsYes()'>はい</span><span class='btn' onclick='gpsNo()'>いいえ</span></div>";
});

function gpsYes(){location.reload();}
function gpsNo(){document.getElementById("dir").innerHTML="位置情報がオフです";}

window.addEventListener("deviceorientation",function(e){
document.getElementById("arrow").style.transform="rotate("+e.alpha+"deg)";
});

function clearStores(){
storeMarkers.forEach(m=>map.removeLayer(m));
storeMarkers=[];
}

function clearRoute(){
if(routeLine)map.removeLayer(routeLine);
routeLine=null;
document.getElementById("eta").innerHTML="";
}

function searchStore(){
clearStores();
clearRoute();
var box=document.getElementById("results");
box.innerHTML="";
box.style.display="none";
var w=document.getElementById("word").value;

fetch("https://nominatim.openstreetmap.org/search?format=json&q="+w)
.then(r=>r.json())
.then(d=>{
box.innerHTML="";
box.style.display="block";
d.forEach(function(s){
var item=document.createElement("div");
item.className="resultItem";
item.innerHTML=s.display_name;
item.onclick=function(){
goTo([s.lat,s.lon]);
box.style.display="none";
};
box.appendChild(item);

var m=L.marker([s.lat,s.lon]).addTo(map);
storeMarkers.push(m);
m.on("click",function(){goTo([s.lat,s.lon]);});
});
});
}

function goTo(dest){
clearRoute();
if(!currentPos){
document.getElementById("dir").innerHTML=
"位置情報をオンにしますか？<div><span class='btn' onclick='gpsYes()'>はい</span><span class='btn' onclick='gpsNo()'>いいえ</span></div>";
return;
}

var url=`https://router.project-osrm.org/route/v1/driving/${currentPos[1]},${currentPos[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true`;

fetch(url).then(r=>r.json()).then(d=>{
steps=d.routes[0].legs[0].steps;

var distance=d.routes[0].distance;
var totalMinutes=(distance/25000)*60;
var h=Math.floor(totalMinutes/60);
var m=Math.round(totalMinutes%60);
var txt=(h>0?h+"時間":"")+m+"分";
document.getElementById("eta").innerHTML=txt;

var coords=d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
routeLine=L.polyline(coords,{color:'blue',weight:5}).addTo(map);
});
}

var twoPointMode=false;
var startPoint=null;
var endPoint=null;
var redLine=null;

document.getElementById("twoPointMode").addEventListener("change",function(){
twoPointMode=this.checked;
startPoint=null;
endPoint=null;
if(redLine)map.removeLayer(redLine);
redLine=null;
});

map.on('click',function(e){
var tap=[e.latlng.lat,e.latlng.lng];

if(twoPointMode){
if(!startPoint){
startPoint=tap;
if(redLine)map.removeLayer(redLine);
redLine=null;
L.marker(startPoint).addTo(map);
return;
}
if(!endPoint){
endPoint=tap;
L.marker(endPoint).addTo(map);
var url=`https://router.project-osrm.org/route/v1/driving/${startPoint[1]},${startPoint[0]};${endPoint[1]},${endPoint[0]}?overview=full&geometries=geojson`;
fetch(url).then(r=>r.json()).then(d=>{
var coords=d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
redLine=L.polyline(coords,{color:'red',weight:5}).addTo(map);
});
return;
}
startPoint=tap;
endPoint=null;
if(redLine)map.removeLayer(redLine);
redLine=null;
L.marker(startPoint).addTo(map);
return;
}

if(lastTapPos && Math.hypot(lastTapPos[0]-tap[0],lastTapPos[1]-tap[1])<0.00005){
lastTapPos=tap;
return;
}

lastTapPos=tap;
clearStores();
goTo(tap);
});
</script>
</body>
</html>
