<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS_MAP_SYSTEM_YUI_SEYAS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#map{position:absolute;inset:0;width:100%;height:100%}
.draggableUI{position:absolute;z-index:9999;background:#fff;border:1px solid #777;border-radius:8px;padding:8px;box-sizing:border-box;touch-action:none;user-select:none}
#searchBox{top:10px;left:50%;transform:translateX(-50%);width:min(92vw,520px)}
#searchInput{width:100%;box-sizing:border-box;font-size:18px;padding:9px;border:1px solid #aaa;border-radius:5px;user-select:text}
#searchResults{max-height:45vh;overflow-y:auto}
.result{padding:10px;border-bottom:1px solid #ddd;cursor:pointer;background:#fff;user-select:text}
.resultName{font-size:18px;font-weight:bold}
.resultAddress{font-size:13px;margin-top:4px}
#followBox{top:100px;left:10px}
#modeBox{top:145px;left:10px}
#routeModeBox{top:190px;left:10px}
#viewBox{top:235px;left:10px}
#walkBox{top:280px;left:10px}
#inventoryBtn{right:10px;top:60px;font-size:18px;cursor:grab}
#cameraBtn{top:10px;right:10px;font-size:18px;cursor:grab}
#locationBtn{right:10px;bottom:150px;font-size:24px;cursor:grab}
#speedNow{left:10px;bottom:65px}
#distanceNow{left:10px;bottom:110px}
#routeInfo{right:10px;bottom:10px}
#dir{left:50%;bottom:10px;transform:translateX(-50%)}
#modeStatus{margin-top:4px;font-weight:bold}
#reward{position:absolute;z-index:11000;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:#fff;border:3px solid #222;border-radius:15px;padding:25px;text-align:center;min-width:280px;box-shadow:0 5px 30px #0008}
#rewardPet{font-size:80px}
#rewardName{font-size:25px;font-weight:bold}
#rewardRarity{font-size:20px;margin:8px}
#inventory{
position:absolute;
z-index:12000;
left:50%;
top:50%;
transform:translate(-50%,-50%);
display:none;
width:min(94vw,620px);
height:min(80vh,560px);
background:#c6c6c6;
border:4px solid #151515;
box-shadow:inset 0 0 0 3px #555,0 8px 35px #0009;
padding:12px;
box-sizing:border-box;
touch-action:none;
user-select:none
}
#inventoryHeader{
height:48px;
background:#8b8b8b;
border:3px solid #555;
box-shadow:inset 2px 2px #ddd,inset -2px -2px #333;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
box-sizing:border-box;
cursor:grab;
font-size:22px;
font-weight:bold
}
#inventoryClose{
font-size:22px;
width:40px;
height:36px;
padding:0;
margin:0;
cursor:pointer
}
#inventoryTitle{
font-size:22px;
text-shadow:1px 1px #fff
}
#petGrid{
margin-top:12px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
overflow-y:auto;
height:calc(100% - 115px);
padding:5px;
box-sizing:border-box;
background:#8b8b8b;
border:3px solid #555;
box-shadow:inset 2px 2px #333,inset -2px -2px #ddd
}
.petSlot{
aspect-ratio:1;
min-width:0;
background:#8b8b8b;
border:3px solid #373737;
box-shadow:inset 2px 2px #555,inset -2px -2px #ccc;
display:flex;
align-items:center;
justify-content:center;
position:relative;
cursor:pointer;
box-sizing:border-box
}
.petSlot:hover{
background:#aaa
}
.petSlot.empty{
cursor:default
}
.petEmoji{
font-size:42px;
line-height:1
}
.petSmallName{
position:absolute;
left:3px;
right:3px;
bottom:3px;
font-size:11px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
text-align:center;
background:#0009;
color:#fff
}
.petNumber{
position:absolute;
left:4px;
top:2px;
font-size:13px;
color:#fff;
text-shadow:2px 2px #000
}
.common{
outline:2px solid #aaa;
outline-offset:-5px
}
.epic{
outline:2px solid #a855f7;
outline-offset:-5px
}
.legend{
outline:2px solid #ffb300;
outline-offset:-5px
}
#inventoryFooter{
margin-top:10px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
background:#8b8b8b;
border:3px solid #555;
box-shadow:inset 2px 2px #ddd,inset -2px -2px #333;
font-size:17px
}
#petDetail{
position:absolute;
z-index:13000;
left:50%;
top:50%;
transform:translate(-50%,-50%);
display:none;
width:min(90vw,330px);
background:#c6c6c6;
border:4px solid #151515;
box-shadow:inset 0 0 0 3px #555,0 8px 35px #0009;
padding:15px;
box-sizing:border-box;
text-align:center
}
#petDetailBox{
background:#8b8b8b;
border:3px solid #555;
padding:15px;
box-shadow:inset 2px 2px #ddd,inset -2px -2px #333
}
#petDetailEmoji{font-size:90px}
#petDetailName{font-size:25px;font-weight:bold}
#petDetailRarity{font-size:20px;margin:8px}
#cameraBox,#titleInputBox,#photoView{position:absolute;z-index:10000;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #000;padding:15px;display:none;text-align:center;max-width:95vw;box-sizing:border-box}
#cameraVideo{width:min(90vw,500px);max-height:70vh}
#photoImg{display:block;max-width:90vw;max-height:75vh;margin:auto}
button,input,select{font-size:18px;margin:5px;padding:6px}
.dragHandle{position:absolute;top:2px;right:5px;font-size:12px;opacity:.35}
</style>
</head>
<body>

<div id="map"></div>

<div id="searchBox" class="draggableUI">
<div class="dragHandle">↕</div>
<input id="searchInput" type="text" placeholder="店を検索 例：コンビニ、ラーメン">
<div id="searchResults"></div>
</div>

<div id="followBox" class="draggableUI">
<div class="dragHandle">↕</div>
<label><input type="checkbox" id="followMode" checked>現在地追従</label>
</div>

<div id="modeBox" class="draggableUI">
<div class="dragHandle">↕</div>
<label><input type="radio" name="moveMode" value="walk" checked>歩き</label>
<label><input type="radio" name="moveMode" value="car">車</label>
<div id="modeStatus">歩き</div>
</div>

<div id="routeModeBox" class="draggableUI">
<div class="dragHandle">↕</div>
<label><input type="checkbox" id="lineMode">現在地→クリック線</label>
<div id="lineStatus"></div>
<label><input type="checkbox" id="routeMode">自分→クリック道のり</label>
<div id="routeStatus"></div>
</div>

<div id="viewBox" class="draggableUI">
<div class="dragHandle">↕</div>
<select id="viewSelect" onchange="changeView()">
<option value="osm">OpenStreetMap</option>
<option value="gsi_light">地理院地図 淡色</option>
<option value="gsi_ortho">地理院地図 オルソ</option>
</select>
</div>

<div id="walkBox" class="draggableUI">
<div class="dragHandle">↕</div>
今日の距離 <span id="walkKm">0.00</span> km
</div>

<div id="inventoryBtn" class="draggableUI" onclick="openInventory()">インベントリ</div>
<div id="cameraBtn" class="draggableUI" onclick="openCamera()">カメラ</div>
<div id="locationBtn" class="draggableUI" onclick="showCurrentLocation()">現在地</div>
<div id="speedNow" class="draggableUI">時速 0.0 km/h</div>
<div id="distanceNow" class="draggableUI">直線距離 0 m</div>
<div id="routeInfo" class="draggableUI">道のり 0 m</div>
<div id="dir" class="draggableUI"></div>

<div id="reward">
<div>2KM達成！</div>
<div id="rewardPet"></div>
<div id="rewardName"></div>
<div id="rewardRarity"></div>
<button onclick="closeReward()">受け取る</button>
</div>

<div id="inventory">
<div id="inventoryHeader">
<span id="inventoryTitle">インベントリ</span>
<button id="inventoryClose" onclick="closeInventory()">×</button>
</div>
<div id="petGrid"></div>
<div id="inventoryFooter">
ペット <span id="petCount" style="margin-left:8px">0</span> 体
</div>
</div>

<div id="petDetail">
<div id="petDetailBox">
<div id="petDetailEmoji"></div>
<div id="petDetailName"></div>
<div id="petDetailRarity"></div>
<button onclick="closePetDetail()">閉じる</button>
</div>
</div>

<div id="cameraBox">
<video id="cameraVideo" autoplay playsinline></video>
<br>
<button onclick="shootPhoto()">撮影</button>
<button onclick="switchCamera()">前後切替</button>
<button onclick="closeCamera()">閉じる</button>
</div>

<div id="titleInputBox">
<div>題名</div>
<input id="titleInput">
<br>
<button onclick="saveTitle()">保存</button>
<button onclick="cancelTitle()">キャンセル</button>
</div>

<div id="photoView">
<div id="photoTitle"></div>
<img id="photoImg">
<br>
<button onclick="closePhoto()">閉じる</button>
</div>

<script>
const UI_POSITION_KEY="gps_map_ui_positions_v7";
const PET_KEY="gps_pet_inventory_v2";
const WALK_REWARD_KEY="gps_walk_reward_v2";

let map=L.map("map",{
zoomControl:true,
scrollWheelZoom:true,
doubleClickZoom:true,
touchZoom:true,
boxZoom:true,
keyboard:true,
dragging:true
}).setView([35,135],5);

let layers={
osm:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}),
gsi_light:L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{maxZoom:18}),
gsi_ortho:L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg",{maxZoom:18})
};

layers.osm.addTo(map);

let currentPos=null;
let currentMarker=null;
let accuracyCircle=null;
let lineEndPoint=null;
let lineEndMarker=null;
let liveLine=null;
let routeDestination=null;
let routeDestinationMarker=null;
let roadRouteLine=null;
let routeRequestId=0;
let lastRouteRequest=0;
let lastPos=null;
let lastSpeedPos=null;
let lastSpeedTime=null;
let targetSpeed=0;
let smoothSpeed=0;
let lineMode=false;
let routeMode=false;
let searchTimer=null;
let cameraStream=null;
let cameraMode="environment";
let tempPhoto=null;
let photoMarkers=[];
let storeMarkers=[];
let totalMeter=0;
let rewardDistance=0;
let rewardCount=0;
let pets=[];

let todayKey="walk_"+new Date().toISOString().slice(0,10);

totalMeter=parseFloat(localStorage.getItem(todayKey)||"0");
rewardDistance=parseFloat(localStorage.getItem("pet_reward_distance")||"0");
rewardCount=parseInt(localStorage.getItem(WALK_REWARD_KEY)||"0");
pets=JSON.parse(localStorage.getItem(PET_KEY)||"[]");

document.getElementById("walkKm").innerText=(totalMeter/1000).toFixed(2);

function saveUIPositions(){
let data={};
document.querySelectorAll(".draggableUI").forEach(function(el){
let r=el.getBoundingClientRect();
data[el.id]={left:Math.round(r.left),top:Math.round(r.top)};
});
localStorage.setItem(UI_POSITION_KEY,JSON.stringify(data));
}

function loadUIPositions(){
let data={};
try{
data=JSON.parse(localStorage.getItem(UI_POSITION_KEY)||"{}");
}catch(e){data={};}

document.querySelectorAll(".draggableUI").forEach(function(el){
let p=data[el.id];
if(!p)return;
el.style.transform="none";
el.style.left=Math.max(0,Math.min(p.left,window.innerWidth-el.offsetWidth))+"px";
el.style.top=Math.max(0,Math.min(p.top,window.innerHeight-el.offsetHeight))+"px";
el.style.right="auto";
el.style.bottom="auto";
});
}

function makeDraggable(el){
let dragging=false;
let sx=0;
let sy=0;
let sl=0;
let st=0;
let moved=false;

function down(e){
if(
e.target.tagName==="INPUT"||
e.target.tagName==="SELECT"||
e.target.tagName==="BUTTON"||
e.target.closest(".result")
)return;

let p=e.touches?e.touches[0]:e;
let r=el.getBoundingClientRect();

dragging=true;
moved=false;
sx=p.clientX;
sy=p.clientY;
sl=r.left;
st=r.top;

el.style.transform="none";
el.style.left=r.left+"px";
el.style.top=r.top+"px";
el.style.right="auto";
el.style.bottom="auto";

if(e.cancelable)e.preventDefault();
}

function move(e){
if(!dragging)return;

let p=e.touches?e.touches[0]:e;
let dx=p.clientX-sx;
let dy=p.clientY-sy;

if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;

let l=Math.max(0,Math.min(sl+dx,window.innerWidth-el.offsetWidth));
let t=Math.max(0,Math.min(st+dy,window.innerHeight-el.offsetHeight));

el.style.left=l+"px";
el.style.top=t+"px";

if(e.cancelable)e.preventDefault();
}

function up(){
if(!dragging)return;
dragging=false;
if(moved)saveUIPositions();
}

el.addEventListener("mousedown",down);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);
el.addEventListener("touchstart",down,{passive:false});
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("touchend",up);
}

document.querySelectorAll(".draggableUI").forEach(makeDraggable);

window.addEventListener("resize",loadUIPositions);

function makeInventoryDraggable(){
let el=document.getElementById("inventory");
let header=document.getElementById("inventoryHeader");
let dragging=false;
let sx=0;
let sy=0;
let sl=0;
let st=0;

function down(e){
if(e.target.closest("button"))return;

let p=e.touches?e.touches[0]:e;
let r=el.getBoundingClientRect();

dragging=true;
sx=p.clientX;
sy=p.clientY;
sl=r.left;
st=r.top;

el.style.transform="none";
el.style.left=r.left+"px";
el.style.top=r.top+"px";
el.style.right="auto";
el.style.bottom="auto";

if(e.cancelable)e.preventDefault();
}

function move(e){
if(!dragging)return;

let p=e.touches?e.touches[0]:e;

let dx=p.clientX-sx;
let dy=p.clientY-sy;

let l=Math.max(
0,
Math.min(
sl+dx,
window.innerWidth-el.offsetWidth
)
);

let t=Math.max(
0,
Math.min(
st+dy,
window.innerHeight-el.offsetHeight
)
);

el.style.left=l+"px";
el.style.top=t+"px";

if(e.cancelable)e.preventDefault();
}

function up(){
if(!dragging)return;
dragging=false;
localStorage.setItem(
"inventory_position",
JSON.stringify({
left:parseInt(el.style.left),
top:parseInt(el.style.top)
})
);
}

header.addEventListener("mousedown",down);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);

header.addEventListener("touchstart",down,{passive:false});
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("touchend",up);
}

function loadInventoryPosition(){
let p=null;

try{
p=JSON.parse(
localStorage.getItem("inventory_position")||"null"
);
}catch(e){}

if(!p)return;

let el=document.getElementById("inventory");

el.style.transform="none";
el.style.left=Math.max(
0,
Math.min(
p.left,
window.innerWidth-el.offsetWidth
)
)+"px";

el.style.top=Math.max(
0,
Math.min(
p.top,
window.innerHeight-el.offsetHeight
)
)+"px";

el.style.right="auto";
el.style.bottom="auto";
}

setTimeout(function(){
loadUIPositions();
loadInventoryPosition();
},100);

function changeView(){
let v=document.getElementById("viewSelect").value;

Object.keys(layers).forEach(function(k){
if(map.hasLayer(layers[k]))map.removeLayer(layers[k]);
});

layers[v].addTo(map);
}

document.querySelectorAll('input[name="moveMode"]').forEach(function(el){
el.addEventListener("change",function(){
document.getElementById("modeStatus").innerText=
this.value==="walk"?"歩き":"車";
});
});

function setCurrentLocation(p){
currentPos=[
p.coords.latitude,
p.coords.longitude
];

if(!currentMarker){
currentMarker=L.circleMarker(currentPos,{
radius:9,
weight:3,
fillOpacity:1
}).addTo(map);
}else{
currentMarker.setLatLng(currentPos);
}

let accuracy=p.coords.accuracy||20;

if(!accuracyCircle){
accuracyCircle=L.circle(currentPos,{
radius:accuracy,
weight:1,
fillOpacity:.12
}).addTo(map);
}else{
accuracyCircle.setLatLng(currentPos);
accuracyCircle.setRadius(accuracy);
}

updateLiveLine();
updateRoadRoute();
updateDistances();
}

function showCurrentLocation(){
if(!navigator.geolocation){
alert("このブラウザでは位置情報を使用できません");
return;
}

navigator.geolocation.getCurrentPosition(
function(p){
setCurrentLocation(p);
map.setView(currentPos,17);
},
function(){
alert("現在地を取得できません。位置情報を許可してください。");
},
{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}
);
}

navigator.geolocation.watchPosition(
function(p){
let now=[
p.coords.latitude,
p.coords.longitude
];

let nowTime=Date.now();

setCurrentLocation(p);

if(lastPos){
let d=distanceBetween(lastPos,now);

if(d>.5&&d<50){
let mode=document.querySelector(
'input[name="moveMode"]:checked'
).value;

if(mode==="walk"){
totalMeter+=d;
rewardDistance+=d;

localStorage.setItem(todayKey,totalMeter);
localStorage.setItem("pet_reward_distance",rewardDistance);

document.getElementById("walkKm").innerText=
(totalMeter/1000).toFixed(2);

checkPetReward();
}
}
}

if(lastSpeedPos){
let d=distanceBetween(lastSpeedPos,now);
let dt=(nowTime-lastSpeedTime)/1000;

if(dt>0&&d<100)targetSpeed=(d/dt)*3.6;
}

lastPos=now;
lastSpeedPos=now;
lastSpeedTime=nowTime;

if(document.getElementById("followMode").checked){
map.setView(
currentPos,
map.getZoom()<15?17:map.getZoom()
);
}

updateLiveLine();
updateRoadRoute();
updateDistances();
},
function(){},
{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}
);

function checkPetReward(){
while(rewardDistance>=2000){
rewardDistance-=2000;

localStorage.setItem(
"pet_reward_distance",
rewardDistance
);

giveRandomPet();
}
}

const petList=[
{name:"スライム",emoji:"🟢",rarity:"common",weight:70},
{name:"ねこ",emoji:"🐱",rarity:"common",weight:70},
{name:"いぬ",emoji:"🐶",rarity:"common",weight:70},
{name:"うさぎ",emoji:"🐰",rarity:"common",weight:70},
{name:"きつね",emoji:"🦊",rarity:"epic",weight:20},
{name:"ドラゴン",emoji:"🐉",rarity:"epic",weight:20},
{name:"ユニコーン",emoji:"🦄",rarity:"epic",weight:20},
{name:"フェニックス",emoji:"🔥",rarity:"legend",weight:10},
{name:"ゴールデンドラゴン",emoji:"🐲",rarity:"legend",weight:10},
{name:"光のペット",emoji:"✨",rarity:"legend",weight:10}
];

function randomPet(){
let total=0;

petList.forEach(function(p){
total+=p.weight;
});

let r=Math.random()*total;

for(let p of petList){
r-=p.weight;

if(r<=0){
return{
id:"pet_"+Date.now()+"_"+Math.random(),
name:p.name,
emoji:p.emoji,
rarity:p.rarity
};
}
}

return petList[0];
}

function giveRandomPet(){
let pet=randomPet();

pets.push(pet);

localStorage.setItem(
PET_KEY,
JSON.stringify(pets)
);

rewardCount++;

localStorage.setItem(
WALK_REWARD_KEY,
rewardCount
);

document.getElementById("rewardPet").innerText=pet.emoji;
document.getElementById("rewardName").innerText=pet.name;
document.getElementById("rewardRarity").innerText=
pet.rarity.toUpperCase();

document.getElementById("reward").style.display="block";
}

function closeReward(){
document.getElementById("reward").style.display="none";
}

function openInventory(){
renderInventory();

document.getElementById("inventory").style.display="block";

setTimeout(loadInventoryPosition,0);
}

function closeInventory(){
document.getElementById("inventory").style.display="none";
}

function renderInventory(){
let grid=document.getElementById("petGrid");

grid.innerHTML="";

for(let i=0;i<25;i++){
let div=document.createElement("div");

if(pets[i]){
let pet=pets[i];

div.className="petSlot "+pet.rarity;

div.innerHTML=
'<div class="petNumber">'+
(i+1)+
'</div>'+
'<div class="petEmoji">'+
pet.emoji+
'</div>'+
'<div class="petSmallName">'+
escapeHTML(pet.name)+
'</div>';

div.onclick=function(){
showPetDetail(pet);
};
}else{
div.className="petSlot empty";

div.innerHTML=
'<div class="petNumber">'+
(i+1)+
'</div>';
}

grid.appendChild(div);
}

document.getElementById("petCount").innerText=pets.length;
}

function showPetDetail(pet){
document.getElementById("petDetailEmoji").innerText=pet.emoji;
document.getElementById("petDetailName").innerText=pet.name;
document.getElementById("petDetailRarity").innerText=
pet.rarity.toUpperCase();

document.getElementById("petDetail").style.display="block";
}

function closePetDetail(){
document.getElementById("petDetail").style.display="none";
}

function updateLiveLine(){
if(!lineMode||!currentPos||!lineEndPoint){
if(liveLine){
map.removeLayer(liveLine);
liveLine=null;
}
return;
}

let points=[currentPos,lineEndPoint];

if(!liveLine){
liveLine=L.polyline(points,{
weight:6,
opacity:.9
}).addTo(map);
}else{
liveLine.setLatLngs(points);
}

document.getElementById("lineStatus").innerText=
"距離 "+formatDistance(
distanceBetween(currentPos,lineEndPoint)
);
}

function updateDistances(){
if(!currentPos)return;

if(lineEndPoint){
let d=distanceBetween(
currentPos,
lineEndPoint
);

document.getElementById("distanceNow").innerText=
"直線距離 "+formatDistance(d);

document.getElementById("lineStatus").innerText=
"距離 "+formatDistance(d);
}

if(routeDestination&&!roadRouteLine){
document.getElementById("routeInfo").innerText="道のり取得中";
}
}

function requestRoadRoute(){
if(!routeMode||!currentPos||!routeDestination)return;

let now=Date.now();

if(now-lastRouteRequest<1000)return;

lastRouteRequest=now;

let requestId=++routeRequestId;

let a=currentPos;
let b=routeDestination;

let url=
"https://router.project-osrm.org/route/v1/driving/"+
a[1]+","+a[0]+";"+
b[1]+","+b[0]+
"?overview=full&geometries=geojson";

fetch(url)
.then(function(r){
return r.json();
})
.then(function(data){
if(
requestId!==routeRequestId||
!routeMode||
!currentPos||
!routeDestination
)return;

if(!data.routes||!data.routes.length){
document.getElementById("routeStatus").innerText=
"道のりを取得できません";
return;
}

let route=data.routes[0];

let coords=
route.geometry.coordinates.map(
function(c){
return[c[1],c[0]];
}
);

if(roadRouteLine){
map.removeLayer(roadRouteLine);
}

roadRouteLine=L.polyline(
coords,
{
weight:7,
opacity:.9
}
).addTo(map);

document.getElementById("routeStatus").innerText=
"道のり "+
formatDistance(route.distance)+
"・"+
formatTime(route.duration);

document.getElementById("routeInfo").innerText=
"道のり "+
formatDistance(route.distance);
})
.catch(function(){
if(requestId!==routeRequestId)return;

document.getElementById("routeStatus").innerText=
"道のりを取得できません";
});
}

function updateRoadRoute(){
if(!routeMode||!currentPos||!routeDestination)return;
requestRoadRoute();
}

document.getElementById("lineMode").addEventListener(
"change",
function(){
lineMode=this.checked;

if(!lineMode){
lineEndPoint=null;

if(lineEndMarker){
map.removeLayer(lineEndMarker);
lineEndMarker=null;
}

if(liveLine){
map.removeLayer(liveLine);
liveLine=null;
}

document.getElementById("lineStatus").innerText="";
}else{
document.getElementById("lineStatus").innerText=
"地図をクリックしてください";
}
}
);

document.getElementById("routeMode").addEventListener(
"change",
function(){
routeMode=this.checked;

if(!routeMode){
routeDestination=null;

if(routeDestinationMarker){
map.removeLayer(routeDestinationMarker);
routeDestinationMarker=null;
}

if(roadRouteLine){
map.removeLayer(roadRouteLine);
roadRouteLine=null;
}

routeRequestId++;

document.getElementById("routeStatus").innerText="";
document.getElementById("routeInfo").innerText=
"道のり 0 m";
}else{
document.getElementById("routeStatus").innerText=
"地図をクリックしてください";
}
}
);

map.on("click",function(e){
if(
e.originalEvent.target.closest(
"#searchBox,#cameraBtn,#locationBtn,#followBox,#modeBox,#routeModeBox,#viewBox,#walkBox,#speedNow,#distanceNow,#routeInfo,#dir,#inventoryBtn,#inventory,#reward,#petDetail"
)
)return;

let point=[
e.latlng.lat,
e.latlng.lng
];

if(lineMode){
lineEndPoint=point;

if(lineEndMarker){
map.removeLayer(lineEndMarker);
}

lineEndMarker=L.circleMarker(
point,
{
radius:7,
weight:2,
fillOpacity:.9
}
).addTo(map);

updateLiveLine();
updateDistances();
}

if(routeMode){
routeDestination=point;

if(routeDestinationMarker){
map.removeLayer(routeDestinationMarker);
}

routeDestinationMarker=L.marker(
point
).addTo(map);

if(roadRouteLine){
map.removeLayer(roadRouteLine);
roadRouteLine=null;
}

document.getElementById("routeStatus").innerText=
"道のりを取得中";

lastRouteRequest=0;
requestRoadRoute();
}
});

function distanceBetween(a,b){
let R=6371000;

let p1=a[0]*Math.PI/180;
let p2=b[0]*Math.PI/180;
let dp=(b[0]-a[0])*Math.PI/180;
let dl=(b[1]-a[1])*Math.PI/180;

let h=
Math.sin(dp/2)**2+
Math.cos(p1)*
Math.cos(p2)*
Math.sin(dl/2)**2;

return R*2*Math.atan2(
Math.sqrt(h),
Math.sqrt(1-h)
);
}

function formatDistance(m){
if(m<1000)return Math.round(m)+" m";
return(m/1000).toFixed(2)+" km";
}

function formatTime(seconds){
let min=Math.round(seconds/60);

if(min<60)return min+"分";

let h=Math.floor(min/60);
let m=min%60;

return h+"時間"+m+"分";
}

function speedLoop(){
smoothSpeed+=
(targetSpeed-smoothSpeed)*.1;

if(Math.abs(smoothSpeed)<.1)smoothSpeed=0;

document.getElementById("speedNow").innerText=
"時速 "+smoothSpeed.toFixed(1)+" km/h";

requestAnimationFrame(speedLoop);
}

speedLoop();

function escapeHTML(s){
return String(s||"").replace(
/[&<>"']/g,
function(c){
return{
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];
}
);
}

async function searchStores(text){
text=text.trim();

if(!text){
document.getElementById("searchResults").innerHTML="";
return;
}

let center=currentPos||map.getCenter();

let lat=center.lat!==undefined?center.lat:center[0];
let lon=center.lng!==undefined?center.lng:center[1];

let url=
"https://nominatim.openstreetmap.org/search?format=jsonv2"+
"&q="+encodeURIComponent(text)+
"&lat="+lat+
"&lon="+lon+
"&limit=15"+
"&addressdetails=1";

try{
let r=await fetch(
url,
{
headers:{Accept:"application/json"}
}
);

let data=await r.json();

showResults(data,text);
}catch(e){
document.getElementById("searchResults").innerHTML=
'<div class="result">検索できませんでした</div>';
}
}

function showResults(data,text){
let box=document.getElementById("searchResults");

box.innerHTML="";

if(!data.length){
box.innerHTML=
'<div class="result">「'+
escapeHTML(text)+
'」が見つかりません</div>';
return;
}

data.forEach(function(item){
let name=
item.name||
(
item.display_name?
item.display_name.split(",")[0]:
"検索結果"
);

let div=document.createElement("div");

div.className="result";

div.innerHTML=
'<div class="resultName">'+
escapeHTML(name)+
'</div>'+
'<div class="resultAddress">'+
escapeHTML(item.display_name||"")+
'</div>';

div.onclick=function(){
let lat=parseFloat(item.lat);
let lon=parseFloat(item.lon);

map.setView([lat,lon],18);

let marker=L.marker(
[lat,lon]
).addTo(map);

marker.bindPopup(
"<b>"+
escapeHTML(name)+
"</b><br>"+
escapeHTML(item.display_name||"")+
'<br><button onclick="routeToStore('+lat+','+lon+')">ここまで道のり</button>'
).openPopup();

storeMarkers.push(marker);
box.innerHTML="";
};

box.appendChild(div);
});
}

function routeToStore(lat,lon){
if(!currentPos){
alert("現在地を取得中です");
return;
}

routeDestination=[lat,lon];
routeMode=true;

document.getElementById("routeMode").checked=true;

if(routeDestinationMarker){
map.removeLayer(routeDestinationMarker);
}

routeDestinationMarker=L.marker(
routeDestination
).addTo(map);

if(roadRouteLine){
map.removeLayer(roadRouteLine);
roadRouteLine=null;
}

lastRouteRequest=0;

document.getElementById("routeStatus").innerText=
"道のりを取得中";

requestRoadRoute();
}

document.getElementById("searchInput").addEventListener(
"input",
function(){
let text=this.value;

clearTimeout(searchTimer);

searchTimer=setTimeout(
function(){
searchStores(text);
},
150
);
}
);

function openCamera(){
if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){
alert("このブラウザではカメラを使用できません");
return;
}

navigator.mediaDevices.getUserMedia({
video:{facingMode:cameraMode},
audio:false
})
.then(function(stream){
cameraStream=stream;

document.getElementById("cameraVideo").srcObject=stream;
document.getElementById("cameraBox").style.display="block";
})
.catch(function(){
alert("カメラを使用できません");
});
}

function closeCamera(){
if(cameraStream){
cameraStream.getTracks().forEach(function(t){
t.stop();
});
cameraStream=null;
}

document.getElementById("cameraVideo").srcObject=null;
document.getElementById("cameraBox").style.display="none";
}

function switchCamera(){
cameraMode=
cameraMode==="environment"?
"user":
"environment";

closeCamera();
openCamera();
}

function shootPhoto(){
if(!currentPos){
alert("現在地を取得中です");
return;
}

let video=document.getElementById("cameraVideo");

if(!video.videoWidth){
alert("カメラ映像を取得中です");
return;
}

let canvas=document.createElement("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

tempPhoto={
id:"photo_"+Date.now(),
lat:currentPos[0],
lon:currentPos[1],
img:canvas.toDataURL("image/jpeg",.8),
title:"写真"
};

closeCamera();

document.getElementById("titleInput").value="";
document.getElementById("titleInputBox").style.display="block";
}

function saveTitle(){
if(!tempPhoto)return;

let title=
document.getElementById("titleInput").value.trim();

if(title)tempPhoto.title=title;

let photos=JSON.parse(
localStorage.getItem("photos")||"[]"
);

photos.push(tempPhoto);

localStorage.setItem(
"photos",
JSON.stringify(photos)
);

addPhotoMarker(tempPhoto);

tempPhoto=null;

document.getElementById(
"titleInputBox"
).style.display="none";
}

function cancelTitle(){
tempPhoto=null;
document.getElementById(
"titleInputBox"
).style.display="none";
}

function addPhotoMarker(p){
let marker=L.marker(
[p.lat,p.lon],
{
icon:L.divIcon({
html:"📷",
className:"",
iconSize:[32,32],
iconAnchor:[16,16]
})
}
).addTo(map);

marker.on("click",function(){
document.getElementById("photoTitle").innerText=
p.title||"写真";

document.getElementById("photoImg").src=p.img;
document.getElementById("photoView").style.display="block";
});

photoMarkers.push(marker);
}

function loadPhotos(){
photoMarkers.forEach(function(m){
map.removeLayer(m);
});

photoMarkers=[];

let photos=JSON.parse(
localStorage.getItem("photos")||"[]"
);

photos.forEach(function(p){
if(p.img)addPhotoMarker(p);
});
}

function closePhoto(){
document.getElementById("photoImg").src="";
document.getElementById("photoView").style.display="none";
}

loadPhotos();
makeInventoryDraggable();

setTimeout(function(){
showCurrentLocation();
},1000);
</script>
