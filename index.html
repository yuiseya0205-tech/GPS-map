<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="WYVgAFbhD_nKs5PT-tZCQ07SoEefCBqN049VzFy6dQw" />
<title>G_P_S_S_P_G</title>
<meta name="description" content="GM_CT_S 地図GPSルート案内写真記録ウェブアプリ">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body{margin:0;overflow:hidden;}
#map{position:absolute;left:0;top:0;width:100%;height:100vh;}
#cameraBtn{position:absolute;top:10px;left:600px;z-index:9999;background:white;padding:10px;font-size:20px;border:1px solid #000;}
#cameraBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;z-index:99999;display:none;text-align:center;}
#cameraVideo{width:300px;height:auto;}
#cameraShoot{font-size:20px;margin-top:10px;}
#titleInputBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;z-index:99999;display:none;}
#titleInput{font-size:20px;width:300px;}
#titleSaveBtn{font-size:20px;margin-top:10px;}
#photoView{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99999;background:white;padding:10px;display:none;text-align:center;}
#photoTitle{font-size:24px;margin-bottom:10px;}
#photoView img{max-width:80vw;max-height:80vh;}
#closePhoto{font-size:20px;margin-top:10px;}
#dir{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:white;padding:10px;font-size:20px;z-index:9999;}
#eta{position:absolute;bottom:0;left:0;background:white;padding:10px;font-size:20px;z-index:9999;}
#arrow{width:30px;height:30px;font-size:30px;position:absolute;top:10px;right:10px;z-index:9999;}
#speedNow{position:absolute;bottom:60px;left:0;background:white;padding:10px;font-size:20px;z-index:9999;}
#followBox{position:absolute;top:10px;left:300px;background:white;padding:10px;font-size:20px;z-index:99999;border:1px solid #000;}
#twoPointBox{position:absolute;top:10px;left:450px;background:white;padding:10px;font-size:20px;z-index:99999;border:1px solid #000;}
#viewBox{position:absolute;top:10px;left:150px;background:white;padding:5px;z-index:9999;}
</style>
</head>
<body>

<h1 style="display:none;">GM_CT_S</h1>
<p style="display:none;">GM_CT_S 地図GPSルート案内写真記録ウェブアプリ</p>

<div id="map"></div>
<div id="cameraBtn" onclick="openCamera()">📷 カメラ</div>
<div id="cameraBox">
<video id="cameraVideo" autoplay></video>
<button id="cameraShoot" onclick="shootPhoto()">撮影</button>
</div>
<div id="titleInputBox">
<div>題名</div>
<input id="titleInput">
<button id="titleSaveBtn" onclick="saveTitle()">保存</button>
</div>
<div id="photoView">
<div id="photoTitle"></div>
<img id="photoImg">
<div id="closePhoto" onclick="closePhoto()">閉じる</div>
</div>
<div id="dir"></div>
<div id="eta"></div>
<div id="arrow">▽</div>
<div id="speedNow"></div>
<div id="followBox"><label><input type="checkbox" id="followMode">追従</label></div>
<div id="twoPointBox"><label><input type="checkbox" id="twoPointMode">2点ルート</label></div>
<div id="viewBox">
<select id="viewSelect" onchange="changeView()">
<option value="osm">OpenStreetMap</option>
<option value="gsi_light">地理院地図 淡色</option>
<option value="gsi_ortho">地理院地図 オルソ</option>
</select>
</div>

<script>
var map=L.map('map').setView([35,135],5);
var layers={
osm:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}),
gsi_light:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18}),
gsi_ortho:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg',{maxZoom:18})
};
layers.osm.addTo(map);

function changeView(){
var v=document.getElementById("viewSelect").value;
Object.values(layers).forEach(l=>map.removeLayer(l));
layers[v].addTo(map);
}

var marker=null;
var routeLine=null;
var currentPos=null;
var steps=[];
var lastTapPos=null;
var lastSpeedPos=null;
var lastSpeedTime=null;
var tempPhoto=null;

navigator.geolocation.watchPosition(function(p){
var now=[p.coords.latitude,p.coords.longitude];
var nowTime=Date.now();
if(lastSpeedPos){
var dx=now[0]-lastSpeedPos[0];
var dy=now[1]-lastSpeedPos[1];
var dist=Math.hypot(dx,dy)*111000;
var dt=(nowTime-lastSpeedTime)/1000;
if(dt>0){
var speed=(dist/dt)*3.6;
document.getElementById("speedNow").innerHTML="時速 "+speed.toFixed(1)+" km/h";
window.autoSpeed=speed;
}
}
lastSpeedPos=now;
lastSpeedTime=nowTime;
currentPos=now;
if(!marker){
marker=L.marker(currentPos).addTo(map);
}else{
marker.setLatLng(currentPos);
}
if(document.getElementById("followMode").checked){
map.setView(currentPos,17);
}
if(steps.length>0){
var next=null;
var dist=999999;
steps.forEach(function(s){
var d=Math.hypot(currentPos[0]-s.maneuver.location[1],currentPos[1]-s.maneuver.location[0]);
if(d<dist){dist=d;next=s;}
});
if(next){
var m=next.maneuver;
var t="";
if(m.modifier==="right")t="右折";
if(m.modifier==="left")t="左折";
if(m.type==="straight")t="直進";
document.getElementById("dir").innerHTML=t;
}
}
});

window.addEventListener("deviceorientation",function(e){
document.getElementById("arrow").style.transform="rotate("+e.alpha+"deg)";
});

function calcTime(distance){
var sp=window.autoSpeed||20;
var totalMinutes=(distance/(sp*1000))*60;
var h=Math.floor(totalMinutes/60);
var m=Math.round(totalMinutes%60);
return (h>0?h+"時間":"")+m+"分";
}

function goTo(dest){
if(!currentPos)return;
var url=`https://router.project-osrm.org/route/v1/driving/${currentPos[1]},${currentPos[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true`;
fetch(url).then(r=>r.json()).then(d=>{
steps=d.routes[0].legs[0].steps;
var distance=d.routes[0].distance;
document.getElementById("eta").innerHTML=calcTime(distance);
var coords=d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
if(routeLine)map.removeLayer(routeLine);
routeLine=L.polyline(coords,{color:'blue',weight:5}).addTo(map);
});
}

var twoPointMode=false;
var startPoint=null;
var endPoint=null;
var redLine=null;

document.getElementById("twoPointMode").addEventListener("change",function(){
twoPointMode=this.checked;
startPoint=null;
endPoint=null;
if(redLine)map.removeLayer(redLine);
redLine=null;
if(routeLine)map.removeLayer(routeLine);
routeLine=null;
document.getElementById("eta").innerHTML="";
});

map.on('click',function(e){
var tap=[e.latlng.lat,e.latlng.lng];
if(twoPointMode){
if(!startPoint){
startPoint=tap;
if(redLine)map.removeLayer(redLine);
redLine=null;
L.marker(startPoint).addTo(map);
return;
}
if(!endPoint){
endPoint=tap;
L.marker(endPoint).addTo(map);
var url=`https://router.project-osrm.org/route/v1/driving/${startPoint[1]},${startPoint[0]};${endPoint[1]},${endPoint[0]}?overview=full&geometries=geojson`;
fetch(url).then(r=>r.json()).then(d=>{
var coords=d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
redLine=L.polyline(coords,{color:'red',weight:5}).addTo(map);
var distance=d.routes[0].distance;
document.getElementById("eta").innerHTML=calcTime(distance);
});
return;
}
startPoint=tap;
endPoint=null;
if(redLine)map.removeLayer(redLine);
redLine=null;
L.marker(startPoint).addTo(map);
return;
}
if(lastTapPos&&Math.hypot(lastTapPos[0]-tap[0],lastTapPos[1]-tap[1])<0.00005){
lastTapPos=tap;
return;
}
lastTapPos=tap;
goTo(tap);
});

function openCamera(){
navigator.mediaDevices.getUserMedia({video:true}).then(function(stream){
document.getElementById("cameraVideo").srcObject=stream;
document.getElementById("cameraBox").style.display="block";
});
}

function shootPhoto(){
var video=document.getElementById("cameraVideo");
var canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
canvas.getContext("2d").drawImage(video,0,0);
var imgData=canvas.toDataURL("image/png");
tempPhoto={lat:currentPos[0],lon:currentPos[1],img:imgData};
document.getElementById("cameraBox").style.display="none";
document.getElementById("titleInputBox").style.display="block";
}

function saveTitle(){
var title=document.getElementById("titleInput").value;
document.getElementById("titleInput").value="";
document.getElementById("titleInputBox").style.display="none";
tempPhoto.title=title;
savePhoto(tempPhoto);
addPhotoMarker(tempPhoto);
tempPhoto=null;
}

function savePhoto(p){
var arr=JSON.parse(localStorage.getItem("photos")||"[]");
arr.push(p);
localStorage.setItem("photos",JSON.stringify(arr));
}

function loadPhotos(){
var arr=JSON.parse(localStorage.getItem("photos")||"[]");
arr.forEach(function(p){
addPhotoMarker(p);
});
}

function addPhotoMarker(p){
var m=L.marker([p.lat,p.lon],{icon:L.divIcon({html:"■",className:"",iconSize:[20,20]})}).addTo(map);
m.on("click",function(){
document.getElementById("photoTitle").innerText=p.title;
document.getElementById("photoImg").src=p.img;
document.getElementById("photoView").style.display="block";
});
}

function closePhoto(){
document.getElementById("photoView").style.display="none";
}

loadPhotos();
</script>
</body>
</html>
