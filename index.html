<script>

/* =========================================
   JSONBIN
========================================= */

const JSONBIN_URL =
"https://api.jsonbin.io/v3/b/6a829d2cf5f4af5e291f1a4e";

const JSONBIN_KEY =
"$2a$10$DKqFC6yTYkzmTbKXVnnDhuV/nvXdKOTSi8rMMHNmicw8l/DohMcE2";


/* =========================================
   ID
========================================= */

function getQueryId(){

    var s=location.search;

    if(!s){
        return null;
    }

    var p=new URLSearchParams(s);

    return p.get("id");
}


function genId(){

    return "ID_" +
        Math.random().toString(36).slice(2) +
        Date.now().toString(36);
}


var storedId=localStorage.getItem("targetId");
var queryId=getQueryId();

var targetId=
    storedId ||
    queryId ||
    genId();

localStorage.setItem("targetId",targetId);


/* =========================================
   地図
========================================= */

var map=L.map("map").setView([35,135],5);


var layers={

    osm:L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19
        }
    ),

    gsi_light:L.tileLayer(
        "https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",
        {
            maxZoom:18
        }
    ),

    gsi_ortho:L.tileLayer(
        "https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg",
        {
            maxZoom:18
        }
    )

};


layers.osm.addTo(map);


function changeView(){

    var v=
        document.getElementById("viewSelect").value;

    Object.values(layers).forEach(function(layer){

        if(map.hasLayer(layer)){
            map.removeLayer(layer);
        }

    });

    layers[v].addTo(map);
}


/* =========================================
   変数
========================================= */

var marker=null;

var currentPos=null;

var lastPos=null;

var routeLine=null;

var steps=[];

var lastTapPos=null;

var lastSpeedPos=null;

var lastSpeedTime=null;

var tempPhoto=null;

var cameraStream=null;

var cameraMode="environment";

var lastVoice="";

var redMarkers=[];

var twoPointMode=false;

var startPoint=null;

var endPoint=null;

var startMarker=null;

var endMarker=null;

var redLine=null;

let smoothSpeed=0;

let targetSpeed=0;


/* =========================================
   今日の距離
========================================= */

var todayKey=
    "walk_"+new Date().toISOString().slice(0,10);

var totalMeter=
    parseFloat(
        localStorage.getItem(todayKey) || "0"
    );

document.getElementById("walkKm").innerText=
    (totalMeter/1000).toFixed(2);


function dist(a,b){

    const R=6371000;

    const lat1=a.lat*Math.PI/180;

    const lat2=b.lat*Math.PI/180;

    const dLat=
        (b.lat-a.lat)*Math.PI/180;

    const dLon=
        (b.lon-a.lon)*Math.PI/180;

    const h=
        Math.sin(dLat/2)**2+
        Math.cos(lat1)*
        Math.cos(lat2)*
        Math.sin(dLon/2)**2;

    return R*
        2*
        Math.atan2(
            Math.sqrt(h),
            Math.sqrt(1-h)
        );
}


/* =========================================
   速度表示
========================================= */

function smoothLoop(){

    smoothSpeed +=
        (targetSpeed-smoothSpeed)*0.15;

    document.getElementById("speedNow").innerHTML=
        "時速 "+
        smoothSpeed.toFixed(1)+
        " km/h";

    requestAnimationFrame(smoothLoop);
}

smoothLoop();


/* =========================================
   GPS
========================================= */

navigator.geolocation.watchPosition(

function(p){

    var now=[
        p.coords.latitude,
        p.coords.longitude
    ];

    var nowTime=Date.now();


    /* 現在位置 */

    currentPos=now;


    /* =====================================
       今日の距離
    ===================================== */

    if(lastPos){

        var d=dist(

            {
                lat:lastPos[0],
                lon:lastPos[1]
            },

            {
                lat:now[0],
                lon:now[1]
            }

        );


        /* GPSの飛びを防止 */

        if(d<50){

            totalMeter += d;

            localStorage.setItem(
                todayKey,
                totalMeter
            );

            document.getElementById(
                "walkKm"
            ).innerText=
                (totalMeter/1000).toFixed(2);
        }

    }


    lastPos=now;


    /* =====================================
       速度計算
    ===================================== */

    if(lastSpeedPos){

        var dx=
            now[0]-
            lastSpeedPos[0];

        var dy=
            now[1]-
            lastSpeedPos[1];

        var distanceMeter=
            Math.hypot(dx,dy)*111000;

        var dt=
            (nowTime-lastSpeedTime)/1000;


        if(dt>0){

            var speed=
                (distanceMeter/dt)*3.6;

            targetSpeed=speed;

            window.autoSpeed=speed;
        }

    }


    lastSpeedPos=now;

    lastSpeedTime=nowTime;


    /* =====================================
       現在地マーカー
    ===================================== */

    if(!marker){

        marker=
            L.marker(currentPos)
            .addTo(map);

    }else{

        marker.setLatLng(currentPos);

    }


    /* =====================================
       追従
    ===================================== */

    if(
        document.getElementById(
            "followMode"
        ).checked
    ){

        map.setView(
            currentPos,
            17
        );

    }


    /* =====================================
       ナビ音声
    ===================================== */

    if(steps.length>0){

        var next=null;

        var nearestDist=999999;


        steps.forEach(function(s){

            var d=
                Math.hypot(
                    currentPos[0]-
                    s.maneuver.location[1],

                    currentPos[1]-
                    s.maneuver.location[0]
                );


            if(d<nearestDist){

                nearestDist=d;

                next=s;

            }

        });


        if(next){

            var m=next.maneuver;

            var t="";

            var rot=0;


            if(m.modifier==="right"){

                t="右折です";

                rot=90;

            }


            if(m.modifier==="left"){

                t="左折です";

                rot=-90;

            }


            if(m.type==="straight"){

                t="直進です";

                rot=180;

            }


            document.getElementById(
                "dir"
            ).innerHTML=t;


            document.getElementById(
                "arrow"
            ).style.transform=
                "rotate("+rot+"deg)";


            if(
                t!=="" &&
                t!==lastVoice
            ){

                lastVoice=t;

                var u=
                    new SpeechSynthesisUtterance(t);

                u.lang="ja-JP";

                speechSynthesis.speak(u);

            }

        }

    }


    /* =====================================
       JSONBIN位置共有
    ===================================== */

    if(queryId){

        sendMyPositionToBin();

    }

},

function(error){

    console.log(
        "GPSエラー:",
        error.message
    );

},

{
    enableHighAccuracy:true,
    maximumAge:1000,
    timeout:10000
}

);


/* =========================================
   ETA
========================================= */

function calcTime(distance){

    var sp=
        window.autoSpeed || 20;

    var totalMinutes=
        (distance/(sp*1000))*60;

    var h=
        Math.floor(totalMinutes/60);

    var m=
        Math.round(totalMinutes%60);


    return(
        h>0 ?
        h+"時間" :
        ""
    )+
    m+
    "分";
}


/* =========================================
   ルート
========================================= */

function goTo(dest){

    if(!currentPos){

        alert(
            "現在地を取得中です。少し待ってください。"
        );

        return;
    }


    var url=
        "https://router.project-osrm.org/route/v1/driving/"+
        currentPos[1]+","+
        currentPos[0]+";"+
        dest[1]+","+
        dest[0]+
        "?overview=full&geometries=geojson&steps=true";


    fetch(url)

    .then(function(r){

        if(!r.ok){

            throw new Error(
                "ルート取得失敗"
            );

        }

        return r.json();

    })

    .then(function(d){

        if(
            !d.routes ||
            !d.routes.length
        ){

            throw new Error(
                "ルートが見つかりません"
            );

        }


        steps=
            d.routes[0].legs[0].steps;


        var distance=
            d.routes[0].distance;


        document.getElementById(
            "eta"
        ).innerHTML=
            calcTime(distance);


        var coords=
            d.routes[0]
            .geometry
            .coordinates
            .map(function(c){

                return[
                    c[1],
                    c[0]
                ];

            });


        if(routeLine){

            map.removeLayer(
                routeLine
            );

        }


        routeLine=
            L.polyline(
                coords,
                {
                    color:"blue",
                    weight:5
                }
            ).addTo(map);


        if(steps.length>0){

            var m=
                steps[0].maneuver;

            var t="";

            var rot=0;


            if(m.modifier==="right"){

                t="右に曲がります";

                rot=90;

            }


            if(m.modifier==="left"){

                t="左に曲がります";

                rot=-90;

            }


            if(m.type==="straight"){

                t="直進です";

                rot=180;

            }


            document.getElementById(
                "arrow"
            ).style.transform=
                "rotate("+rot+"deg)";


            if(t!==""){

                lastVoice=t;

                var u=
                    new SpeechSynthesisUtterance(t);

                u.lang="ja-JP";

                speechSynthesis.speak(u);

            }

        }

    })

    .catch(function(error){

        console.error(error);

        alert(
            "ルートを取得できませんでした。"
        );

    });

}


/* =========================================
   2点ルート
========================================= */

document.getElementById(
    "twoPointMode"
).addEventListener(
    "change",
    function(){

        twoPointMode=this.checked;


        startPoint=null;

        endPoint=null;


        if(redLine){

            map.removeLayer(
                redLine
            );

            redLine=null;

        }


        if(startMarker){

            map.removeLayer(
                startMarker
            );

            startMarker=null;

        }


        if(endMarker){

            map.removeLayer(
                endMarker
            );

            endMarker=null;

        }


        if(routeLine){

            map.removeLayer(
                routeLine
            );

            routeLine=null;

        }


        steps=[];

        document.getElementById(
            "eta"
        ).innerHTML="";

        document.getElementById(
            "dir"
        ).innerHTML="";

    }
);


/* =========================================
   地図クリック
========================================= */

map.on(
    "click",
    function(e){

        var tap=[
            e.latlng.lat,
            e.latlng.lng
        ];


        /* =================================
           2点ルートモード
        ================================= */

        if(twoPointMode){

            /* 1点目 */

            if(!startPoint){

                startPoint=tap;


                if(startMarker){

                    map.removeLayer(
                        startMarker
                    );

                }


                startMarker=
                    L.marker(
                        startPoint
                    ).addTo(map);

                return;

            }


            /* 2点目 */

            if(!endPoint){

                endPoint=tap;


                if(endMarker){

                    map.removeLayer(
                        endMarker
                    );

                }


                endMarker=
                    L.marker(
                        endPoint
                    ).addTo(map);


                var url=
                    "https://router.project-osrm.org/route/v1/driving/"+
                    startPoint[1]+","+
                    startPoint[0]+";"+
                    endPoint[1]+","+
                    endPoint[0]+
                    "?overview=full&geometries=geojson&steps=true";


                fetch(url)

                .then(function(r){

                    if(!r.ok){

                        throw new Error(
                            "ルート取得失敗"
                        );

                    }

                    return r.json();

                })

                .then(function(d){

                    if(
                        !d.routes ||
                        !d.routes.length
                    ){

                        throw new Error(
                            "ルートなし"
                        );

                    }


                    var coords=
                        d.routes[0]
                        .geometry
                        .coordinates
                        .map(function(c){

                            return[
                                c[1],
                                c[0]
                            ];

                        });


                    if(redLine){

                        map.removeLayer(
                            redLine
                        );

                    }


                    redLine=
                        L.polyline(
                            coords,
                            {
                                color:"red",
                                weight:5
                            }
                        ).addTo(map);


                    steps=
                        d.routes[0]
                        .legs[0]
                        .steps;


                    var distance=
                        d.routes[0].distance;


                    document.getElementById(
                        "eta"
                    ).innerHTML=
                        calcTime(distance);


                    if(steps.length>0){

                        var m=
                            steps[0].maneuver;

                        var t="";

                        var rot=0;


                        if(
                            m.modifier==="right"
                        ){

                            t="右に曲がります";

                            rot=90;

                        }


                        if(
                            m.modifier==="left"
                        ){

                            t="左に曲がります";

                            rot=-90;

                        }


                        if(
                            m.type==="straight"
                        ){

                            t="直進です";

                            rot=180;

                        }


                        document.getElementById(
                            "arrow"
                        ).style.transform=
                            "rotate("+rot+"deg)";


                        if(t!==""){

                            lastVoice=t;

                            var u=
                                new SpeechSynthesisUtterance(t);

                            u.lang="ja-JP";

                            speechSynthesis.speak(u);

                        }

                    }

                })

                .catch(function(error){

                    console.error(error);

                    alert(
                        "2点ルートを取得できませんでした。"
                    );

                });


                return;

            }


            /* 3回目のクリックで新しいスタート地点 */

            startPoint=tap;

            endPoint=null;


            if(redLine){

                map.removeLayer(
                    redLine
                );

                redLine=null;

            }


            if(endMarker){

                map.removeLayer(
                    endMarker
                );

                endMarker=null;

            }


            if(startMarker){

                map.removeLayer(
                    startMarker
                );

            }


            startMarker=
                L.marker(
                    startPoint
                ).addTo(map);


            return;

        }


        /* =================================
           通常ルート
        ================================= */

        if(
            lastTapPos &&
            Math.hypot(
                lastTapPos[0]-tap[0],
                lastTapPos[1]-tap[1]
            )<0.00005
        ){

            lastTapPos=tap;

            return;

        }


        lastTapPos=tap;

        goTo(tap);

    }
);


/* =========================================
   カメラ
========================================= */

async function openCamera(){

    try{

        cameraStream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:cameraMode
                }

            });


        document.getElementById(
            "cameraVideo"
        ).srcObject=
            cameraStream;


        document.getElementById(
            "cameraBox"
        ).style.display="block";

    }

    catch(error){

        console.error(error);

        alert(
            "カメラを使用できませんでした。\n"+
            "カメラの使用許可を確認してください。"
        );

    }

}


function switchCamera(){

    cameraMode=
        cameraMode==="environment"
        ? "user"
        : "environment";


    closeCamera();

    openCamera();

}


function closeCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(function(t){

                t.stop();

            });

        cameraStream=null;

    }


    document.getElementById(
        "cameraVideo"
    ).srcObject=null;


    document.getElementById(
        "cameraBox"
    ).style.display="none";

}


/* =========================================
   撮影
========================================= */

function shootPhoto(){

    if(!currentPos){

        alert(
            "GPS位置を取得中です。\n"+
            "少し待ってから撮影してください。"
        );

        return;

    }


    var video=
        document.getElementById(
            "cameraVideo"
        );


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        alert(
            "カメラ映像を取得できていません。"
        );

        return;

    }


    var canvas=
        document.createElement(
            "canvas"
        );


    canvas.width=
        video.videoWidth;

    canvas.height=
        video.videoHeight;


    canvas
        .getContext("2d")
        .drawImage(
            video,
            0,
            0
        );


    var imgData=
        canvas.toDataURL(
            "image/png"
        );


    tempPhoto={

        lat:currentPos[0],

        lon:currentPos[1],

        img:imgData

    };


    closeCamera();


    document.getElementById(
        "titleInputBox"
    ).style.display="block";

}


/* =========================================
   写真タイトル
========================================= */

function saveTitle(){

    if(!tempPhoto){

        return;

    }


    var title=
        document.getElementById(
            "titleInput"
        ).value;


    document.getElementById(
        "titleInput"
    ).value="";


    document.getElementById(
        "titleInputBox"
    ).style.display="none";


    tempPhoto.title=
        title || "無題";


    savePhoto(
        tempPhoto
    );


    addPhotoMarker(
        tempPhoto
    );


    saveBin();


    tempPhoto=null;

}


/* =========================================
   写真保存
========================================= */

function savePhoto(p){

    var arr=
        JSON.parse(
            localStorage.getItem(
                "photos"
            ) || "[]"
        );


    arr.push(p);


    localStorage.setItem(
        "photos",
        JSON.stringify(arr)
    );

}


function loadPhotos(){

    var arr=
        JSON.parse(
            localStorage.getItem(
                "photos"
            ) || "[]"
        );


    arr.forEach(function(p){

        addPhotoMarker(p);

    });

}


/* =========================================
   写真マーカー
========================================= */

function addPhotoMarker(p){

    var m=
        L.marker(

            [
                p.lat,
                p.lon
            ],

            {
                icon:
                    L.divIcon({

                        html:
                            '<span style="color:red;font-size:20px;">■</span>',

                        className:"",

                        iconSize:[
                            20,
                            20
                        ]

                    })
            }

        ).addTo(map);


    m.on(
        "click",
        function(){

            if(
                confirm(
                    "削除しますか？"
                )
            ){

                deletePhoto(p);

                map.removeLayer(m);

                saveBin();

                return;

            }


            document.getElementById(
                "photoTitle"
            ).innerText=
                p.title;


            document.getElementById(
                "photoImg"
            ).src=
                p.img;


            document.getElementById(
                "photoView"
            ).style.display=
                "block";

        }
    );

}


/* =========================================
   写真削除
========================================= */

function deletePhoto(p){

    var arr=
        JSON.parse(
            localStorage.getItem(
                "photos"
            ) || "[]"
        );


    arr=
        arr.filter(function(x){

            return !(
                x.lat===p.lat &&
                x.lon===p.lon &&
                x.title===p.title
            );

        });


    localStorage.setItem(
        "photos",
        JSON.stringify(arr)
    );

}


function closePhoto(){

    document.getElementById(
        "photoView"
    ).style.display="none";

}


/* =========================================
   QRコード
========================================= */

function openQR(){

    var url=
        location.origin+
        location.pathname+
        "?id="+
        encodeURIComponent(
            targetId
        );


    var qrUrl=
        "https://api.qrserver.com/v1/create-qr-code/"+
        "?size=250x250&data="+
        encodeURIComponent(url);


    document.getElementById(
        "qrImg"
    ).src=
        qrUrl;


    document.getElementById(
        "qrBox"
    ).style.display=
        "block";

}


function closeQR(){

    document.getElementById(
        "qrBox"
    ).style.display=
        "none";

}


/* =========================================
   JSONBIN 写真ポイント
========================================= */

function getLocalPoints(){

    var arr=
        JSON.parse(
            localStorage.getItem(
                "photos"
            ) || "[]"
        );


    return arr.map(function(p){

        return{

            lat:p.lat,

            lon:p.lon,

            title:p.title

        };

    });

}


/* =========================================
   JSONBIN 保存
========================================= */

function saveBin(){

    var points=
        getLocalPoints();


    fetch(
        JSONBIN_URL,
        {
            method:"GET",

            headers:{
                "X-Master-Key":
                    JSONBIN_KEY
            }
        }
    )

    .then(function(r){

        return r.json();

    })

    .then(function(data){

        var record=
            data.record || {};


        record.targetId=
            targetId;


        record.points=
            points;


        record.targets=
            record.targets || [];


        return fetch(
            JSONBIN_URL,
            {

                method:"PUT",

                headers:{

                    "Content-Type":
                        "application/json",

                    "X-Master-Key":
                        JSONBIN_KEY

                },

                body:
                    JSON.stringify(
                        record
                    )

            }
        );

    })

    .catch(function(error){

        console.error(
            "JSONBIN保存エラー:",
            error
        );

    });

}


/* =========================================
   JSONBIN 読み込み
========================================= */

function loadBin(){

    fetch(

        JSONBIN_URL,

        {

            headers:{

                "X-Master-Key":
                    JSONBIN_KEY

            }

        }

    )

    .then(function(r){

        return r.json();

    })

    .then(function(data){

        var record=
            data.record || {};


        /* 写真ポイント */

        if(record.points){

            record.points.forEach(
                function(p){

                    L.marker(

                        [
                            p.lat,
                            p.lon
                        ],

                        {

                            icon:
                                L.divIcon({

                                    html:
                                        '<span style="color:red;font-size:20px;">■</span>',

                                    className:"",

                                    iconSize:[
                                        20,
                                        20
                                    ]

                                })

                        }

                    ).addTo(map);

                }
            );

        }


        /* 位置共有 */

        if(record.targets){

            redMarkers.forEach(
                function(m){

                    map.removeLayer(m);

                }
            );


            redMarkers=[];


            record.targets.forEach(
                function(t){

                    if(
                        t.id===targetId
                    ){

                        var m=
                            L.marker(

                                [
                                    t.lat,
                                    t.lon
                                ],

                                {

                                    icon:
                                        L.divIcon({

                                            html:
                                                '<span style="color:red;font-size:20px;">●</span>',

                                            className:"",

                                            iconSize:[
                                                20,
                                                20
                                            ]

                                        })

                                }

                            ).addTo(map);


                        redMarkers.push(m);

                    }

                }
            );

        }

    })

    .catch(function(error){

        console.error(
            "JSONBIN読み込みエラー:",
            error
        );

    });

}


/* =========================================
   自分の位置をJSONBINへ送信
========================================= */

function sendMyPositionToBin(){

    if(!currentPos){

        return;

    }


    fetch(

        JSONBIN_URL,

        {

            headers:{

                "X-Master-Key":
                    JSONBIN_KEY

            }

        }

    )

    .then(function(r){

        return r.json();

    })

    .then(function(data){

        var record=
            data.record || {};


        record.targetId=
            record.targetId ||
            targetId;


        record.points=
            record.points || [];


        record.targets=
            record.targets || [];


        var meIndex=
            record.targets.findIndex(
                function(t){

                    return t.id===targetId;

                }
            );


        var obj={

            id:targetId,

            lat:currentPos[0],

            lon:currentPos[1]

        };


        if(meIndex>=0){

            record.targets[
                meIndex
            ]=obj;

        }else{

            record.targets.push(
                obj
            );

        }


        return fetch(

            JSONBIN_URL,

            {

                method:"PUT",

                headers:{

                    "Content-Type":
                        "application/json",

                    "X-Master-Key":
                        JSONBIN_KEY

                },

                body:
                    JSON.stringify(
                        record
                    )

            }

        );

    })

    .catch(function(error){

        console.error(
            "位置送信エラー:",
            error
        );

    });

}


/* =========================================
   起動
========================================= */

loadPhotos();

loadBin();

setInterval(
    loadBin,
    5000
);

</script>
